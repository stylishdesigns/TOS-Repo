<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Tutorial OS</title>
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#EA580C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tutorial OS" />
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:wght@600;700&family=Space+Grotesk:wght@500;700&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <meta name="description" content="Multi-Tenant Education Facility Management System and Dynamic Website CMS for automating student admissions, fees, timetables, CBT practice tests, and tutor operations." />
    <meta property="og:title" content="Tutorial OS" />
    <meta property="og:description" content="Multi-Tenant Education Facility Management System and Dynamic Website CMS for automating student admissions, fees, timetables, CBT practice tests, and tutor operations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" style="position:fixed;inset:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2147483647;">
        <style>
          @keyframes boot-dot { 0%,100% { transform: translateY(0) scale(.85); opacity:.35 } 40% { transform: translateY(-7px) scale(1.15); opacity:1 } }
          #boot-splash .card { width: 112px; height: 112px; border-radius: 24px; background: #fff; box-shadow: 0 10px 30px rgba(15,23,42,0.18); display: flex; align-items: center; justify-content: center; overflow: hidden; }
          #boot-splash .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 24px; }
          #boot-splash .name { font-weight: 900; letter-spacing: -0.02em; font-size: 26px; text-align: center; padding: 0 24px; margin-top: 24px; line-height: 1.25; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
          #boot-splash .dots { display: flex; gap: 8px; margin-top: 22px; }
          #boot-splash .dots i { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; animation: boot-dot 1.05s cubic-bezier(.45,0,.55,1) infinite; }
          #boot-splash .dots i:nth-child(2) { animation-delay: 0.16s; }
          #boot-splash .dots i:nth-child(3) { animation-delay: 0.32s; }
        </style>
        <div class="card"><img id="boot-logo" src="" alt="" style="display:none" /></div>
        <div class="name" id="boot-name"></div>
        <div class="dots" id="boot-dots"><i></i><i></i><i></i></div>
        <script>
          (function () {
            try {
              // The boot splash follows the door the visitor knocked on: facility
              // portals open on the facility's brand, while Tutorial OS's own
              // surfaces (landing, TOS console) load on TOS's own white style,
              // never on whatever facility this device last visited.
              var h = (window.location.hash || '').toLowerCase();
              var facilityRoute = h.indexOf('#student') === 0 || h.indexOf('#tutor') === 0 || h.indexOf('#install') === 0 || h.indexOf('#access') === 0 || h.indexOf('#centre') === 0;
              var b = null;
              try { b = JSON.parse(localStorage.getItem('tos:launch-brand') || 'null'); } catch (e) { b = null; }
              var el = document.getElementById('boot-splash');
              var nm = document.getElementById('boot-name');
              var img = document.getElementById('boot-logo');
              var hex = facilityRoute && b && /^#[0-9a-fA-F]{6}$/.test(String(b.accent || '')) ? String(b.accent) : '';
              if (hex) {
                var n = parseInt(hex.slice(1), 16);
                var lum = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
                var darkText = lum > 0.62;
                el.style.background = hex;
                el.style.color = darkText ? '#0f172a' : '#ffffff';
                var dots = document.getElementById('boot-dots');
                if (dots) Array.prototype.forEach.call(dots.children, function (d) { d.style.background = darkText ? '#0f172a' : '#ffffff'; });
                if (b.name) nm.textContent = String(b.name);
                if (b.logo) { img.src = String(b.logo); img.style.display = 'block'; }
              } else {
                el.style.background = '#ffffff';
                el.style.color = '#0f172a';
                if (nm) nm.textContent = 'Tutorial OS';
                if (img) { img.src = '/icon.svg'; img.style.display = 'block'; }
              }
            } catch (e) { /* never block the app on splash styling */ }
          })();
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
