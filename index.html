  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#EA580C" />

    <!-- PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:wght@600;700&family=Space+Grotesk:wght@500;700&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

    <meta property="og:title" content="Tutorial OS" />
    <meta property="og:description" content="Multi-Tenant Education Facility Management System and Dynamic Website CMS for automating student admissions, fees, timetables, CBT practice tests, and tutor operations." />

  </head>
  <body>
    <div id="root">
      <div id="boot-splash" style="position:fixed;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2147483647;">
        <style>
          @keyframes boot-spin { to { transform: rotate(360deg); } }
          #boot-splash .ring {
            width: 96px; height: 96px; border-radius: 50%;
            border: 4px solid rgba(234,88,12,0.2);
            border-top-color: #EA580C;
            animation: boot-spin 0.9s linear infinite;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 32px;
          }
          #boot-splash .dot { width: 8px; height: 8px; border-radius: 50%; background: #EA580C; }
          #boot-splash .name { color: #EA580C; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; font-size: 20px; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
          #boot-splash .note { color: #94a3b8; font-size: 12px; margin-top: 8px; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
        </style>
        <div class="ring"><div class="dot"></div></div>
        <div class="name">Tutorial OS</div>
        <div class="note">Loading your facility app...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
